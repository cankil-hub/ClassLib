{% extends 'base.html' %}

{% block title %}管理文件标签{% endblock %}

{% block content %}
<p class="breadcrumb"><a href="{% url 'library:file' document.pk %}">返回 {{ document.name }}</a></p>
<section class="auth-card" aria-labelledby="file-tags-title">
    <h1 id="file-tags-title">管理文件标签</h1>
    <p class="muted">为“{{ document.name }}”选择标签。</p>
    <form method="post" class="stack-form">
        {% csrf_token %}
        {{ form.tags.label_tag }}
        <div class="tag-picker">{{ form.tags }}</div>
        {% for error in form.tags.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
        <button class="button" type="submit">保存标签</button>
    </form>
    <p><a href="{% url 'library:tag_create' %}">创建新标签</a></p>
</section>
{% endblock %}
