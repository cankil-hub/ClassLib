{% extends 'base.html' %}

{% block title %}资源库{% endblock %}

{% block content %}
<section class="hero">
    <div>
        <p class="eyebrow">班级学习资料库</p>
        <h1>找到你需要的学习资料</h1>
        <p class="hero-copy">按学科浏览班级资料，后续可使用文件名、文件夹名和标签搜索。</p>
    </div>
    <form class="search-form" action="{% url 'library:search' %}" method="get" role="search">
        <label class="sr-only" for="home-search">搜索资料</label>
        <input id="home-search" name="q" type="search" placeholder="搜索文件或文件夹" autocomplete="off">
        <button class="button" type="submit">搜索</button>
    </form>
</section>

<section aria-labelledby="folders-title">
    <div class="section-heading">
        <h2 id="folders-title">学科文件夹</h2>
        <span class="muted">{{ folders|length }} 个文件夹</span>
    </div>
    <div class="folder-grid">
        {% for folder in folders %}
            <a class="folder-card" href="{% url 'library:folder' folder.id %}">
                <span class="folder-icon" aria-hidden="true">📁</span>
                <span><strong>{{ folder.name }}</strong><small>{{ folder.description }}</small></span>
            </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
