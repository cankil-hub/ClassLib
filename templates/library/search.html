{% extends 'base.html' %}

{% block title %}搜索{% endblock %}

{% block content %}
<section class="page-heading">
    <p class="eyebrow">资源库</p>
    <h1>搜索资料</h1>
    <form class="search-form search-form-wide" action="{% url 'library:search' %}" method="get" role="search">
        <label class="sr-only" for="search-query">搜索资料</label>
        <input id="search-query" name="q" type="search" value="{{ query }}" placeholder="输入文件名或文件夹名">
        <button class="button" type="submit">搜索</button>
    </form>
</section>
{% if has_searched %}
    <div class="empty-state compact"><h2>暂无搜索结果</h2><p>Phase 4 将接入文件名、文件夹名和标签搜索。</p></div>
{% else %}
    <div class="empty-state compact"><h2>输入关键词开始搜索</h2></div>
{% endif %}
{% endblock %}
